set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 10000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Config recargado"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S "
set -g status-left-style "bg=default,fg=default"
set -g status-right "#[fg=#1e1e2e,bg=#a6e3a1] %H:%M #[fg=#cdd6f4] %d-%b-%y"
set -g window-status-current-style "fg=#1e1e2e,bg=#cba6f7,bold"
set -g window-status-style "fg=#cdd6f4,bg=#313244"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g status-bg "#1e1e2e"
